name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Package
        working-directory: backend
        run: ./mvnw -B -q package -DskipTests

  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build mp-weixin
        working-directory: frontend
        env:
          VITE_MP_CLOUD_ENV: ${{ secrets.MP_CLOUD_ENV }}
          VITE_MP_SERVICE_NAME: ${{ secrets.MP_SERVICE_NAME }}
        run: npm run build:mp-weixin
      - name: Prepare upload key
        working-directory: frontend
        run: printf '%s' "${{ secrets.MP_PRIVATE_KEY }}" > private.key
      - name: Upload preview build
        working-directory: frontend
        run: |
          npx miniprogram-ci upload \
            --pp ./dist/build/mp-weixin \
            --pkp ./private.key \
            --appid "${{ secrets.MP_APPID }}" \
            --uv "${GITHUB_RUN_NUMBER}" \
            --ud "${GITHUB_SHA::7}"
